<div class="quote-results">
  <!-- Page Header -->
  <div class="page-header">
    <h2 class="page-title">Available Plans</h2>
    <p class="page-subtitle">Choose the best plan for your family</p>
  </div>

  <!-- Filters Section -->
  <div class="filters-section">
    <div class="filter-group">
      <label class="filter-label">Sum Insured</label>
      <select 
        class="filter-select"
        [value]="selectedSumInsured()"
        (change)="onFilterChange('sumInsured', +$any($event.target).value)">
        <option *ngFor="let option of sumInsuredOptions" [value]="option">
          ₹{{ option }} Lakhs
        </option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Insurer</label>
      <select 
        class="filter-select"
        [value]="selectedInsurer()"
        (change)="onFilterChange('insurer', $any($event.target).value)">
        <option value="">All Insurers</option>
        <option *ngFor="let option of insurerOptions" [value]="option">
          {{ option }}
        </option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Family Type</label>
      <select 
        class="filter-select"
        [value]="selectedFamilyType()"
        (change)="onFilterChange('familyType', $any($event.target).value)">
        <option value="">All Types</option>
        <option *ngFor="let option of familyTypeOptions" [value]="option">
          {{ option }}
        </option>
      </select>
    </div>
  </div>

  <!-- Plans List -->
  <div class="plans-container">
    <div class="plan-card" *ngFor="let plan of plans()">
      <!-- Plan Header -->
      <div class="plan-header">
        <div class="plan-logo">{{ plan.logo }}</div>
        <div class="plan-info">
          <h3 class="plan-name">{{ plan.name }}</h3>
          <p class="plan-premium">{{ formatPremium(plan.premium) }}/year</p>
        </div>
      </div>

      <!-- Plan Details -->
      <div class="plan-details">
        <div class="detail-row">
          <span class="detail-label">🏥 Cashless Hospitals</span>
          <span class="detail-value">{{ plan.hospitals }}+</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">✓ Claim Settlement</span>
          <span class="detail-value">{{ plan.claimRatio }}%</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">💰 Sum Insured</span>
          <span class="detail-value">₹{{ plan.sumInsured }} L</span>
        </div>
      </div>

      <!-- Buy Now Button -->
      <button 
        class="btn-buy-now"
        (click)="buyNow(plan.id)"
        type="button">
        Buy Now →
      </button>
    </div>
  </div>

  <!-- Back to Home Button -->
  <div class="back-to-home">
    <button 
      class="btn-home"
      (click)="goHome()"
      type="button">
      ← Back to Home
    </button>
  </div>
</div>
